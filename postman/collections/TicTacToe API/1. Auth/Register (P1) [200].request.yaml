$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
body:
  type: json
  content: |-
    {
        "login": "{{username}}",
        "password": "{{password}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      const rand = Math.floor(Math.random() * 100000);
      pm.environment.set("username", `player1_${rand}`);
    language: text/javascript
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 1000
