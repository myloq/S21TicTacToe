$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
body:
  type: json
  content: |-
    {
        "login": "{{player2_username}}",
        "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res.accessToken) {
          pm.environment.set("player2_accessToken", res.accessToken);
          const payload = JSON.parse(atob(res.accessToken.split('.')[1]));
          const uid = payload["http://schemas.xmlsoap.org/ws/2005/05/identity/claims/nameidentifier"];
          pm.environment.set("player2_userId", uid);
      }
    language: text/javascript
order: 6000
