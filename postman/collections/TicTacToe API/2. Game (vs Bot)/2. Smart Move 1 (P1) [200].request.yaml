$kind: http-request
url: "{{baseUrl}}/game/{{botGameId}}"
method: POST
body:
  type: json
  content: |-
    {
        "id": "{{botGameId}}",
        "board": {{newBoard}},
        "status": "InProgress"
    }
auth:
  type: basic
  credentials:
    username: "{{username}}"
    password: "{{password}}"
scripts:
  - type: beforeRequest
    code: |-
      const baseUrl = pm.environment.get('baseUrl');
      const gameId = pm.environment.get('botGameId');
      const u = pm.environment.get('username');
      const p = pm.environment.get('password');
      const token = btoa(`${u}:${p}`);

      pm.sendRequest({ url: `${baseUrl}/game/${gameId}`, method: 'GET', header: { 'Authorization': `Basic ${token}` } }, (err, res) => {
          const g = res.json();
          if(g.currentPlayerId !== pm.environment.get('userId')) { console.log('Not our turn'); return; }
          let mySymbol = g.player1Id === pm.environment.get('userId') ? g.player1Symbol : g.player2Symbol;
          let board = g.board; let found = false;
          for(let i=0; i<3; i++) { for(let j=0; j<3; j++) { if(board[i][j] === 0 && !found) { board[i][j] = mySymbol; found = true; } } }
          pm.variables.set('newBoard', JSON.stringify(board));
      });
    language: text/javascript
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000
