$kind: http-request
url: "{{baseUrl}}/game/{{gameId}}"
method: POST
body:
  type: json
  content: |-
    {
        "id": "{{gameId}}",
        "board": {{newBoard}},
        "status": "InProgress"
    }
auth:
  type: basic
  credentials:
    username: "{{username}}"
    password: "{{password}}"
scripts:
  - type: beforeRequest
    code: |-
      // Умный скрипт: узнает, чей ход, и ставит правильный символ в первую свободную клетку
      const baseUrl = pm.environment.get('baseUrl');
      const gameId = pm.environment.get('gameId');
      const u = pm.environment.get('username');
      const p = pm.environment.get('password');
      const token = btoa(`${u}:${p}`);

      pm.sendRequest({
          url: `${baseUrl}/game/${gameId}`,
          method: 'GET',
          header: { 'Authorization': `Basic ${token}` }
      }, (err, res) => {
          const g = res.json();
          let mySymbol = g.player1Id === pm.environment.get('userId') ? g.player1Symbol : g.player2Symbol;
          let board = g.board;
          let found = false;
          for(let i=0; i<3; i++) {
              for(let j=0; j<3; j++) {
                  if(board[i][j] === 0 && !found) { board[i][j] = mySymbol; found = true; }
              }
          }
          pm.variables.set('newBoard', JSON.stringify(board));
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status is 200 or 400 (if not your turn)", () => {
          pm.expect([200, 400]).to.include(pm.response.code);
      });
    language: text/javascript
order: 4000
