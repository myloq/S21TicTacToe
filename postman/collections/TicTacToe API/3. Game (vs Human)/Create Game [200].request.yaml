$kind: http-request
url: "{{baseUrl}}/game"
method: POST
body:
  type: json
  content: |-
    {
        "opponentType": "human"
    }
auth:
  type: basic
  credentials:
    username: "{{username}}"
    password: "{{password}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      const res = pm.response.json();
      if (res.id) pm.environment.set("gameId", res.id);
    language: text/javascript
order: 1000
