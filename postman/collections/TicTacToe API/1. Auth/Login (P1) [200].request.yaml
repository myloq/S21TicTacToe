$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
body:
  type: json
  content: |-
    {
        "login": "{{username}}",
        "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      const res = pm.response.json();
      if (res.accessToken) {
          pm.environment.set("accessToken", res.accessToken);
          pm.environment.set("refreshToken", res.refreshToken);
          // Расшифровываем JWT, чтобы достать userId из claims
          const payload = JSON.parse(atob(res.accessToken.split('.')[1]));
          const uid = payload["http://schemas.xmlsoap.org/ws/2005/05/identity/claims/nameidentifier"];
          pm.environment.set("userId", uid);
      }
    language: text/javascript
order: 2000
