<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicTacToe - Professional Edition</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <h1>TicTacToe</h1>
    <div id="userInfo" class="hidden">
        <span>Привет, <b id="currentUser"></b>!</span>
        <button id="logoutBtn" class="btn btn-danger">Выйти</button>
    </div>
</header>

<main>
    <!-- Блок авторизации -->
    <section id="authSection" class="card">
        <h2>Вход / Регистрация</h2>
        <div class="input-group">
            <input id="loginInput" type="text" placeholder="Логин" autocomplete="username" />
            <input id="passwordInput" type="password" placeholder="Пароль" autocomplete="current-password" />
        </div>
        <div class="btn-group">
            <button id="loginBtn" class="btn btn-primary">Войти</button>
            <button id="registerBtn" class="btn btn-secondary">Зарегистрироваться</button>
        </div>
        <div id="authError" class="error-text"></div>
    </section>

    <!-- Основное приложение -->
    <section id="appSection" class="hidden">
        <nav class="tabs">
            <button class="tab-btn active" data-tab="playTab">Игра</button>
            <button class="tab-btn" data-tab="historyTab">История игр</button>
            <button class="tab-btn" data-tab="leaderboardTab">Таблица лидеров</button>
        </nav>

        <!-- Вкладка: Игра -->
        <div id="playTab" class="tab-content active">
            <div class="controls">
                <button id="newBotGame" class="btn btn-primary">Против бота</button>
                <button id="newHumanGame" class="btn btn-secondary">Создать игру</button>
                <button id="refreshAvailable" class="btn btn-outline">Доступные игры</button>
            </div>

            <div id="availableGamesBlock" class="card hidden">
                <h3>Доступные игры</h3>
                <div id="availableGamesList" class="game-list"></div>
            </div>

            <div class="game-area">
                <div class="game-info">
                    <span id="status" class="status-badge">Ожидание действия</span>
                    <div class="game-id-row">
                        <input id="gameId" type="text" placeholder="UUID игры" readonly />
                        <button id="copy" class="btn btn-outline">Копировать</button>
                        <button id="load" class="btn btn-outline">Загрузить</button>
                    </div>
                </div>
                <div id="board" class="board"></div>
            </div>
        </div>

        <!-- Вкладка: История -->
        <div id="historyTab" class="tab-content">
            <button id="loadHistoryBtn" class="btn btn-secondary">Обновить историю</button>
            <div id="historyList" class="list-container"></div>
        </div>

        <!-- Вкладка: Лидерборд -->
        <div id="leaderboardTab" class="tab-content">
            <button id="loadLeaderboardBtn" class="btn btn-secondary">Обновить лидерборд</button>
            <div class="table-responsive">
                <table class="leaderboard-table">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Игрок</th>
                        <th>Win Ratio</th>
                    </tr>
                    </thead>
                    <tbody id="leaderboardBody"></tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<script src="js/app.js"></script>
</body>
</html>
