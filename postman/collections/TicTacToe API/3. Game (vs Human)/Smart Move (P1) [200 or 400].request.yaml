$kind: http-request
url: "{{baseUrl}}/game/{{gameId}}"
method: POST
body:
  type: json
  content: |-
    {
        "id": "{{gameId}}",
        "board": {{newBoard}},
        "status": "InProgress"
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: beforeRequest
    code: |-
      const baseUrl = pm.environment.get('baseUrl');
      const gameId = pm.environment.get('gameId');
      const token = pm.environment.get('accessToken');
      pm.sendRequest({ url: `${baseUrl}/game/${gameId}`, method: 'GET', header: { 'Authorization': `Bearer ${token}` } }, (err, res) => {
          const g = res.json();
          let mySymbol = g.player1Id === pm.environment.get('userId') ? g.player1Symbol : g.player2Symbol;
          let board = g.board; let found = false;
          for(let i=0; i<3; i++) for(let j=0; j<3; j++) { if(board[i][j] === 0 && !found) { board[i][j] = mySymbol; found = true; } }
          pm.variables.set('newBoard', JSON.stringify(board));
      });
    language: text/javascript
  - type: afterResponse
    code: pm.test("Status 200 or 400", () => pm.expect([200, 400]).to.include(pm.response.code));
    language: text/javascript
order: 4000
