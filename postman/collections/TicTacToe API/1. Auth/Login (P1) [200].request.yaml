$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
auth:
  type: basic
  credentials:
    username: "{{username}}"
    password: "{{password}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      const res = pm.response.json();
      if (res.userId) pm.environment.set("userId", res.userId);
    language: text/javascript
order: 2000
