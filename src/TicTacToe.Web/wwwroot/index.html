<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>T04</title>
    <style>
        body { font-family: system-ui, sans-serif; display: flex; flex-direction: column;
            align-items: center; gap: 1rem; padding: 2rem; }
        #board { display: grid; grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px); gap: 4px; }
        .cell { display: flex; align-items: center; justify-content: center;
            font-size: 3rem; background: #f0f0f0; cursor: pointer;
            border: none; border-radius: 8px; user-select: none; }
        .cell:disabled { cursor: default; }
        .cell.cross { color: #d32f2f; }
        .cell.zero  { color: #1976d2; }
        #status { font-size: 1.2rem; min-height: 1.5rem; }
        .row { display: flex; gap: .5rem; align-items: center; }
        #gameId { width: 22rem; padding: .4rem .6rem; font-family: monospace; }
        button { padding: .5rem 1rem; font-size: 1rem; cursor: pointer; }
        button:disabled { cursor: not-allowed; opacity: .5; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem 1.5rem;
            display: flex; flex-direction: column; gap: .75rem; align-items: stretch;
            min-width: 22rem; }
        .card h2 { margin: 0 0 .25rem 0; font-size: 1.1rem; text-align: center; }
        input { padding: .5rem .6rem; font-size: 1rem; border: 1px solid #ccc;
            border-radius: 6px; }
        .muted { color: #666; font-size: .9rem; }
        .error { color: #c62828; font-size: .9rem; min-height: 1.2rem; }
        .hidden { display: none !important; }
        #userBar { display: flex; gap: 1rem; align-items: center; }
    </style>
</head>
<body>
<h1>Крестики-Нолики</h1>

<!-- ─── Форма входа / регистрации ──────────────────────────────────── -->
<section id="authBlock" class="card">
    <h2>Вход</h2>
    <input id="loginInput" type="text" placeholder="Логин" autocomplete="username" />
    <input id="passwordInput" type="password" placeholder="Пароль" autocomplete="current-password" />
    <div class="row">
        <button id="loginBtn">Войти</button>
        <button id="registerBtn">Зарегистрироваться</button>
    </div>
    <div id="authError" class="error"></div>
    <div class="muted">Basic Auth: пара логин/пароль уходит в заголовке `Authorization`.</div>
</section>

<!-- ─── Игровой интерфейс ─────────────────────────────────────────── -->
<section id="gameBlock" class="hidden">
    <div id="userBar">
        <span>Вы вошли как <b id="currentUser"></b></span>
        <button id="logoutBtn">Выйти</button>
    </div>

    <div class="row">
        <label for="gameId">ID игры:</label>
        <input id="gameId" type="text" spellcheck="false" placeholder="UUID" />
        <button id="load">Загрузить</button>
    </div>

    <div class="row">
        <button id="new">Новая игра</button>
        <button id="copy" title="Скопировать ID">Копировать ID</button>
    </div>

    <div id="status">Нажмите «Новая игра»</div>
    <div id="board"></div>
</section>

<script>
    // ─── Состояние ────────────────────────────────────────────────
    const CROSS = 1, ZERO = 2;
    let game = null, busy = false;
    let humanSide = CROSS;
    let authToken = null;   // base64(login:password) — то, что уходит в Authorization
    let currentLogin = null;

    // ─── Элементы ─────────────────────────────────────────────────
    const boardEl        = document.getElementById('board');
    const statusEl       = document.getElementById('status');
    const idEl           = document.getElementById('gameId');
    const authBlock      = document.getElementById('authBlock');
    const gameBlock      = document.getElementById('gameBlock');
    const loginInput     = document.getElementById('loginInput');
    const passwordInput  = document.getElementById('passwordInput');
    const authError      = document.getElementById('authError');
    const currentUserEl  = document.getElementById('currentUser');

    // ─── Утилиты ──────────────────────────────────────────────────
    // Basic-заголовок = base64(login:password). Учтём Unicode.
    function makeBasicToken(login, password) {
        const bytes = new TextEncoder().encode(`${login}:${password}`);
        let bin = '';
        for (const b of bytes) bin += String.fromCharCode(b);
        return btoa(bin);
    }

    function authHeaders(extra = {}) {
        return authToken
            ? { ...extra, 'Authorization': 'Basic ' + authToken }
            : { ...extra };
    }

    function saveSession(token, login) {
        authToken = token;
        currentLogin = login;
        sessionStorage.setItem('basicToken', token);
        sessionStorage.setItem('login', login);
    }

    function clearSession() {
        authToken = null;
        currentLogin = null;
        game = null;
        sessionStorage.removeItem('basicToken');
        sessionStorage.removeItem('login');
    }

    function showAuth() {
        gameBlock.classList.add('hidden');
        authBlock.classList.remove('hidden');
        currentUserEl.textContent = '';
    }

    function showGame() {
        authBlock.classList.add('hidden');
        gameBlock.classList.remove('hidden');
        currentUserEl.textContent = currentLogin ?? '';
    }

    // Если сервер вернул 401 — сессия недействительна, показываем форму заново.
    function handleUnauthorized() {
        clearSession();
        showAuth();
        authError.textContent = 'Сессия истекла. Войдите снова.';
    }

    // Восстанавливаем сессию после перезагрузки страницы (F5).
    (function restoreSession() {
        const t = sessionStorage.getItem('basicToken');
        const l = sessionStorage.getItem('login');
        if (t && l) {
            authToken = t;
            currentLogin = l;
            showGame();
        } else {
            showAuth();
        }
    })();

    // ─── Кнопки входа / регистрации / выхода ──────────────────────
    document.getElementById('loginBtn').addEventListener('click', login);
    document.getElementById('registerBtn').addEventListener('click', register);
    document.getElementById('logoutBtn').addEventListener('click', () => {
        clearSession();
        showAuth();
    });

    // Enter в любом поле формы — логин.
    [loginInput, passwordInput].forEach(el =>
        el.addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); login(); }
        })
    );
    
    function detectHumanSide() {
        if (!game) return;
        if (game.status === 'CrossTurn')      humanSide = CROSS;
        else if (game.status === 'ZeroTurn')  humanSide = ZERO;
        // CrossWin / ZeroWin / Draw — оставляем как было
    }

    async function register() {
        authError.textContent = '';
        const login = loginInput.value.trim();
        const password = passwordInput.value;

        if (!login || !password) { authError.textContent = 'Введите логин и пароль'; return; }

        try {
            const res = await fetch('/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ login, password })
            });

            if (res.status === 409) { authError.textContent = 'Логин уже занят'; return; }
            if (!res.ok) {
                const p = await res.json().catch(() => null);
                authError.textContent = p?.detail ?? `Ошибка регистрации: ${res.status}`;
                return;
            }

            // Сразу логинимся тем же логином/паролем.
            await login();
        } catch (e) {
            authError.textContent = 'Сеть недоступна';
            console.error(e);
        }
    }

    async function login() {
        authError.textContent = '';
        const login = loginInput.value.trim();
        const password = passwordInput.value;

        if (!login || !password) { authError.textContent = 'Введите логин и пароль'; return; }

        const token = makeBasicToken(login, password);

        try {
            const res = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Authorization': 'Basic ' + token }
            });

            if (res.status === 401) { authError.textContent = 'Неверный логин или пароль'; return; }
            if (!res.ok) {
                const p = await res.json().catch(() => null);
                authError.textContent = p?.detail ?? `Ошибка входа: ${res.status}`;
                return;
            }

            saveSession(token, login);
            passwordInput.value = '';
            showGame();
            statusEl.textContent = 'Нажмите «Новая игра»';
        } catch (e) {
            authError.textContent = 'Сеть недоступна';
            console.error(e);
        }
    }

    // ─── Игровые действия ─────────────────────────────────────────

    document.getElementById('new').addEventListener('click', newGame);
    document.getElementById('load').addEventListener('click', loadGame);
    document.getElementById('copy').addEventListener('click', () => {
        if (!idEl.value) return;
        navigator.clipboard.writeText(idEl.value)
            .then(() => statusEl.textContent = 'ID скопирован')
            .catch(() => statusEl.textContent = 'Не удалось скопировать');
    });

    idEl.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); loadGame(); }
    });

    async function newGame() {
        if (!authToken) { handleUnauthorized(); return; }

        try {
            const res = await fetch('/game', {
                method: 'POST',
                headers: authHeaders()
            });

            if (res.status === 401) { handleUnauthorized(); return; }
            if (!res.ok) { statusEl.textContent = `Ошибка: ${res.status}`; return; }

            game = await res.json();
            detectHumanSide();
            render();
        } catch (e) {
            statusEl.textContent = 'Сеть недоступна';
            console.error(e);
        }
    }

    async function loadGame() {
        if (!authToken) { handleUnauthorized(); return; }

        const id = idEl.value.trim();
        if (!id) { statusEl.textContent = 'Введите ID'; return; }

        try {
            const res = await fetch(`/game/${id}`, {
                method: 'GET',
                headers: authHeaders()
            });

            if (res.status === 401) { handleUnauthorized(); return; }
            if (!res.ok) {
                const p = await res.json().catch(() => null);
                statusEl.textContent = p?.detail ?? `Игра не найдена (${res.status})`;
                return;
            }

            game = await res.json();
            detectHumanSide();
            render();
        } catch (e) {
            statusEl.textContent = 'Сеть недоступна';
            console.error(e);
        }
    }

    async function makeMove(row, col) {
        if (busy || !game) return;
        if (game.status !== 'CrossTurn' && game.status !== 'ZeroTurn') return;
        if (game.board[row][col] !== 0) return;
        if (!authToken) { handleUnauthorized(); return; }

        const newBoard = game.board.map(r => [...r]);
        newBoard[row][col] = humanSide;

        busy = true;
        try {
            const res = await fetch(`/game/${game.id}`, {
                method: 'POST',
                headers: authHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify({
                    id: game.id,
                    board: newBoard,
                    status: game.status
                })
            });

            if (res.status === 401) { handleUnauthorized(); return; }
            if (!res.ok) {
                const problem = await res.json().catch(() => null);
                statusEl.textContent = problem?.detail ?? `Ошибка: ${res.status}`;
                return;
            }

            game = await res.json();
            detectHumanSide();
            render();
        } catch (e) {
            statusEl.textContent = 'Сеть недоступна';
            console.error(e);
        } finally {
            busy = false;
        }
    }

    function render() {
        idEl.value = game.id;

        const isHumanTurn =
            (game.status === 'CrossTurn' && humanSide === CROSS) ||
            (game.status === 'ZeroTurn'  && humanSide === ZERO);

        boardEl.innerHTML = '';
        for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
            const btn = document.createElement('button');
            btn.className = 'cell';
            const v = game.board[i][j];
            if (v === CROSS) { btn.textContent = '×'; btn.classList.add('cross'); }
            else if (v === ZERO) { btn.textContent = '○'; btn.classList.add('zero'); }
            btn.disabled = v !== 0 || !isHumanTurn;
            btn.addEventListener('click', () => makeMove(i, j));
            boardEl.appendChild(btn);
        }
        statusEl.textContent = statusText(game.status);
    }
    
    function statusText(s) {
        switch (s) {
            case 'CrossTurn': return 'Ход крестиков (×)';
            case 'ZeroTurn':  return 'Ход ноликов (○)';
            case 'CrossWin':  return 'Победили крестики (×)';
            case 'ZeroWin':   return 'Победили нолики (○)';
            case 'Draw':      return 'Ничья.';
            default:          return s;
        }
    }
</script>
</body>
</html>
