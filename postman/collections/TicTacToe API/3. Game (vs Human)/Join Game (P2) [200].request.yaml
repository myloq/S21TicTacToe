$kind: http-request
url: "{{baseUrl}}/game/{{gameId}}/join"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{player2_accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Game is InProgress", () => pm.expect(pm.response.json().status).to.eql('InProgress'));
    language: text/javascript
order: 3000
