$kind: http-request
url: "{{baseUrl}}/game/available"
method: GET
auth:
  type: basic
  credentials:
    username: "{{player2_username}}"
    password: "{{password}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000
