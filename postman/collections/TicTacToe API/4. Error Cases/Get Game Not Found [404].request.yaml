$kind: http-request
url: "{{baseUrl}}/game/00000000-0000-0000-0000-000000000000"
method: GET
auth:
  type: basic
  credentials:
    username: "{{username}}"
    password: "{{password}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 404 Not Found", () => pm.response.to.have.status(404));
    language: text/javascript
order: 3000
